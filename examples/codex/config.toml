# %USERPROFILE%\.codex\config.toml
# The password is forwarded from the environment. It is not written here.

[mcp_servers.tuwezip]
command = 'C:\TuweZip\mcp\tuwezip-mcp.exe'
args = []
cwd = 'C:\TuweZip\mcp'
env_vars = ["BIDXIN_WALLET_PASSWORD"]

[mcp_servers.tuwezip.env]
TUWE_AGENT_ALLOW_DIRS = 'C:\Users\you\Desktop;C:\Users\you\Documents;C:\Users\you\AppData\Local\TuweZip\agent-out'
